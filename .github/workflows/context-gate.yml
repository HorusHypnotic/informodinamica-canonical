name: Context Gate

on:
  pull_request:
    paths:
      - "context-gate/**"
      - "scripts/context_gate.py"
      - "tests/context_gate/**"
      - "AGENTS.md"
  push:
    paths:
      - "context-gate/**"
      - "scripts/context_gate.py"
      - "tests/context_gate/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/context_gate -v
      - run: python scripts/context_gate.py --project informodinamica-canonical --repo .
