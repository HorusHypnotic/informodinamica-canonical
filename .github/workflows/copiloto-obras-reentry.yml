name: Copiloto Obras Reentry

on:
  push:
    branches:
      - copiloto-obras-reentry-001
    paths:
      - "opera/copiloto-obras/**"
      - ".github/workflows/copiloto-obras-reentry.yml"
  pull_request:
    paths:
      - "opera/copiloto-obras/**"
      - ".github/workflows/copiloto-obras-reentry.yml"

jobs:
  historical-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opera/copiloto-obras
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run preserved historical suite
        run: python -m pytest -q
