name: Deploy TPC Vitrine to GitHub Pages

on:
  push:
    branches: [ main ]

  # Permite execução manual na aba Actions
  workflow_dispatch:

# Configura permissões do GITHUB_TOKEN para o deployment no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.4.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static frontend for GitHub Pages
        run: |
          # Se necessário gerar dados estáticos ou bundle client-side
          pnpm build
        env:
          VITE_BASE_URL: "/informodinamica-canonical/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4